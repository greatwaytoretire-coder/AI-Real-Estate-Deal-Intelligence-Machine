[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-real-estate-deal-intelligence-machine"
version = "1.0.0"
description = "AI-powered real estate deal intelligence SaaS platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=9.0.0",
]


api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]


production = [
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "stripe>=9.0.0",
]


[project.scripts]

ai-deal-machine = "ai_real_estate_deal_intelligence_machine.main:main"


[tool.setuptools.packages.find]

where = ["."]
include = [
    "ai_real_estate_deal_intelligence_machine*"
]